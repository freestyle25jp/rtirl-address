<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTIRL Address Overlay</title>
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <!-- Firebase v8 SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #address {
            color: white;
            font-size: 30px;
            font-family: 'Archivo Black', sans-serif;
            font-weight: normal;
            text-align: left;
            white-space: nowrap;
            text-shadow: 3px 3px 0px rgba(0,0,0,1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #address.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="address">
        Carregando...
    </div>

<script>
const params = new URLSearchParams(window.location.search);
const pullKey = params.get("key");
const mapboxToken = params.get("token");
const language = params.get("lang") || "pt";
const addressElement = document.getElementById("address");

const MIN_DISTANCE_METERS = 15;
const MIN_UPDATE_TIME = 3000;

let lastLatitude = null;
let lastLongitude = null;
let lastGeocodeTime = 0;
let geocoding = false;

function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

async function updateAddress(latitude, longitude) {
    if (geocoding) return;
    geocoding = true;

    try {
        const url = "https://api.mapbox.com/geocoding/v5/mapbox.places/" +
            longitude + "," + latitude + ".json?access_token=" +
            encodeURIComponent(mapboxToken) + "&language=" +
            encodeURIComponent(language);

        const response = await fetch(url);
        const data = await response.json();

        if (!data.features) return;

        function findType(type) {
            return data.features.find(
                feature => feature.place_type && feature.place_type.includes(type)
            );
        }

        const address = findType("address");
        const locality = findType("locality");
        const neighborhood = findType("neighborhood");
        const place = findType("place");
        const district = findType("district");

        let street = "";
        if (address && address.text) {
            street = address.text;
        } else if (neighborhood && neighborhood.text) {
            street = neighborhood.text;
        }

        let city = "";
        if (locality && locality.text) {
            city = locality.text;
        } else if (place && place.text) {
            city = place.text;
        } else if (district && district.text) {
            city = district.text;
        }

        let result = "";
        if (street) result = street;
        if (city) {
            if (result) result += ", ";
            result += city;
        }

        if (result) {
            addressElement.innerText = result;
            addressElement.classList.add("show");
            console.log("Endereço atualizado:", result);
        }
    } catch (error) {
        console.error("Erro ao buscar endereço:", error);
    } finally {
        geocoding = false;
    }
}

function handleLocation(location) {
    if (!location) return;
    const latitude = location.latitude;
    const longitude = location.longitude;

    if (latitude === undefined || longitude === undefined) return;

    const now = Date.now();

    if (lastLatitude === null || lastLongitude === null) {
        lastLatitude = latitude;
        lastLongitude = longitude;
        lastGeocodeTime = now;
        updateAddress(latitude, longitude);
        return;
    }

    const distance = getDistanceMeters(lastLatitude, lastLongitude, latitude, longitude);
    const timePassed = now - lastGeocodeTime;

    if (distance >= MIN_DISTANCE_METERS && timePassed >= MIN_UPDATE_TIME) {
        console.log("Movimento detectado:", Math.round(distance), "metros");
        lastLatitude = latitude;
        lastLongitude = longitude;
        lastGeocodeTime = now;
        updateAddress(latitude, longitude);
    }
}

function start() {
    if (!pullKey) {
        addressElement.innerText = "ERRO: Pull Key não encontrada";
        addressElement.classList.add("show");
        return;
    }

    if (!mapboxToken) {
        addressElement.innerText = "ERRO: Token Mapbox não encontrado";
        addressElement.classList.add("show");
        return;
    }

    const firebaseConfig = {
        apiKey: "AIzaSyC4L8ICZbJDufxe8bimRdB5cAulPCaYVQQ",
        databaseURL: "https://rtirl-a1d7f-default-rtdb.firebaseio.com",
        projectId: "rtirl-a1d7f",
        appId: "1:684852107701:web:d77a8ed0ee5095279a61fc"
    };

    // Inicialização corrigida sem nome customizado de app
    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();
    const locationRef = database.ref().child("pullables").child(pullKey).child("location");

    console.log("Aguardando localização...");

    locationRef.on("value", function(snapshot) {
        const location = snapshot.val();
        handleLocation(location);
    });
}

start();
</script>

</body>
</html>
